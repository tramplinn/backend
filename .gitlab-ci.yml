stages:
  - lint
  - test
  - security
  - build
  - deploy
  - scan

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

default:
  tags:
    - docker
    - linux

variables:
  SSH_USER: "user1"
  SSH_PORT: "15945"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

compose-config:
  stage: lint
  image: docker:29.7.2
  script:
    - cp .env.staging.example .env.runtime
    - COMPOSE_PROJECT_NAME=tramplin-stage docker compose
      --env-file .env.runtime -f docker-compose.staging.yml config --quiet

lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:0.12.1-python3.14-trixie-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen
  script:
    - uv run ruff check src tests scripts alembic
    - uv run ruff format --check src tests scripts alembic
  after_script:
    - uv cache prune --ci

typecheck:
  stage: lint
  image: ghcr.io/astral-sh/uv:0.12.1-python3.14-trixie-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen
  script:
    - uv run mypy src tests scripts alembic
  after_script:
    - uv cache prune --ci

test:
  stage: test
  image: ghcr.io/astral-sh/uv:0.12.1-python3.14-trixie-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen
  script:
    - uv run pytest --junitxml=report.xml --cov-report=xml:coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
  after_script:
    - uv cache prune --ci

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

semgrep:
  stage: security
  image: semgrep/semgrep:1.172.0
  script:
    - semgrep scan --config=p/python --config=p/owasp-top-ten --error .

trivy-sca:
  stage: security
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

build-and-push:
  stage: build
  image: docker:29.7.2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "stage"'
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
      image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout "$CI_REGISTRY"

deploy-stage:
  stage: deploy
  image: alpine:3.24.1
  variables:
    DEPLOY_PATH: "/home/$SSH_USER/apps/backend_stage"
  before_script:
    - apk add --no-cache openssh-client
    - export SSH_AUTH_SOCK=/tmp/ssh-agent.sock
    - ssh-agent -a "$SSH_AUTH_SOCK" >/dev/null
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf 'Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n' "$SSH_PORT" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - ssh "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
    - scp docker-compose.staging.yml scripts/deploy.sh "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
    - scp "$STAGE_ENV" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/.env.runtime"
    - ssh "$SSH_USER@$SERVER_IP" "chmod 600 $DEPLOY_PATH/.env.runtime"
    - printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$SSH_USER@$SERVER_IP" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - ssh "$SSH_USER@$SERVER_IP"
      "bash $DEPLOY_PATH/deploy.sh '$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA' 'tramplin-stage' '$CI_REGISTRY'"
  environment:
    name: staging
    url: "$STAGE_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'

deploy-production:
  stage: deploy
  image: alpine:3.24.1
  variables:
    DEPLOY_PATH: "/home/$SSH_USER/apps/backend_prod"
  before_script:
    - apk add --no-cache openssh-client
    - export SSH_AUTH_SOCK=/tmp/ssh-agent.sock
    - ssh-agent -a "$SSH_AUTH_SOCK" >/dev/null
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf 'Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n' "$SSH_PORT" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - ssh "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
    - scp docker-compose.staging.yml scripts/deploy.sh "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
    - scp "$PROD_ENV" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/.env.runtime"
    - ssh "$SSH_USER@$SERVER_IP" "chmod 600 $DEPLOY_PATH/.env.runtime"
    - printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$SSH_USER@$SERVER_IP" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - ssh "$SSH_USER@$SERVER_IP"
      "bash $DEPLOY_PATH/deploy.sh '$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA' 'tramplin-prod' '$CI_REGISTRY'"
  environment:
    name: production
    url: "$PROD_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

nuclei-scan:
  stage: scan
  image:
    name: projectdiscovery/nuclei:v3.11.0
    entrypoint: [""]
  script:
    - nuclei -u "$TARGET_URL" -severity critical,high,medium
      -tags cve,exposure,misconfiguration -jsonl -o nuclei-report.jsonl
  artifacts:
    when: always
    paths:
      - nuclei-report.jsonl
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'
      variables:
        TARGET_URL: "$STAGE_URL"
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        TARGET_URL: "$PROD_URL"
