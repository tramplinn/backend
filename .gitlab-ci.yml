stages:
  - test
  - build
  - deploy
  - scan

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

default:
  tags: [saas-linux-small-amd64]

variables:
  API_IMAGE: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

quality:
  stage: test
  needs: []
  image: ghcr.io/astral-sh/uv:0.12.1-python3.14-trixie-slim
  # Интеграционные тесты (tests/integration) гоняются на настоящей Postgres с pgvector.
  services:
    - name: pgvector/pgvector:pg18
      alias: postgres
  variables:
    POSTGRES_DB: tramplin_test
    POSTGRES_USER: tramplin
    POSTGRES_PASSWORD: tramplin
    TEST_DATABASE_URL: "postgresql+asyncpg://tramplin:tramplin@postgres:5432/tramplin_test"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen
  script:
    - uv run ruff check src tests admin alembic
    - uv run ruff format --check src tests admin alembic
    - uv run mypy src tests admin alembic
    - uv run pytest --junitxml=report.xml --cov-report=xml:coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
  after_script:
    - uv cache prune --ci

gitleaks:
  stage: test
  needs: []
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

semgrep:
  stage: test
  needs: []
  image: semgrep/semgrep:1.172.0
  script:
    - semgrep scan --config=p/python --config=p/owasp-top-ten --error .

trivy-sca:
  stage: test
  needs: []
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

build:
  stage: build
  needs:
    - job: quality
      artifacts: false
  image: docker:29.7.2
  services:
    - name: docker:29.7.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --provenance=false -t "$API_IMAGE" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
      image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      "$API_IMAGE"
    - docker push "$API_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY"
    - docker builder prune -af

validate-k8s:
  stage: test
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  script:
    - kubectl kustomize k8s/ > /dev/null

deploy-production:
  stage: deploy
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  variables:
    KUBE_CONTEXT: tramplin1/infra:tramplin
  resource_group: tramplin-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  timeout: 60m
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml k8s/migration-job.yaml
    - sed -i "s/REPLACE_PROJECT_ID/$CI_PROJECT_ID/g" k8s/secrets/store.yaml
    - |
      if grep -Eq 'REPLACE_|\.invalid' k8s/configmap.yaml; then
        echo 'Fill public settings in k8s/configmap.yaml before deployment.' >&2
        exit 1
      fi
    - kubectl apply --dry-run=server -k k8s/ >/dev/null
    - kubectl -n tramplin apply -f k8s/secrets/store.yaml
    - kubectl -n tramplin wait --for=condition=Ready secretstore/gitlab-tramplin-backend --timeout=120s
    - kubectl -n tramplin apply -f k8s/secrets/external-secrets.yaml
    - kubectl -n tramplin wait --for=condition=Ready externalsecret/tramplin-backend --timeout=180s
    - kubectl -n tramplin wait --for=condition=Ready externalsecret/gitlab-registry --timeout=180s
    - kubectl -n tramplin wait --for=condition=Ready externalsecret/postgres-app externalsecret/redis externalsecret/rabbitmq --timeout=180s
    - kubectl -n tramplin rollout status statefulset/postgres --timeout=300s
    - kubectl -n tramplin rollout status statefulset/redis --timeout=300s
    - kubectl -n tramplin rollout status statefulset/rabbitmq --timeout=300s
    - kubectl -n tramplin rollout status statefulset/piston --timeout=600s
    - kubectl -n tramplin delete job tramplin-migrate --ignore-not-found --wait=true --timeout=60s
    - kubectl create --dry-run=server -f k8s/migration-job.yaml >/dev/null
    - kubectl create -f k8s/migration-job.yaml
    - |
      if ! kubectl -n tramplin wait --for=condition=Complete job/tramplin-migrate --timeout=660s; then
        kubectl -n tramplin logs job/tramplin-migrate --tail=100 || true
        exit 1
      fi
    - kubectl apply -k k8s/
    - kubectl -n tramplin rollout restart deployment/tramplin-api
    - kubectl -n tramplin rollout status deployment/tramplin-api --timeout=600s
    - kubectl -n tramplin rollout restart deployment/tramplin-algorithm-worker
    - kubectl -n tramplin rollout status deployment/tramplin-algorithm-worker --timeout=600s
    - kubectl -n tramplin rollout restart deployment/tramplin-embedding-worker
    - kubectl -n tramplin rollout status deployment/tramplin-embedding-worker --timeout=600s
    - kubectl -n tramplin rollout restart deployment/tramplin-email-worker
    - kubectl -n tramplin rollout status deployment/tramplin-email-worker --timeout=600s
    - kubectl -n tramplin wait --for=create certificate/tramplin-api-tls --timeout=120s
    - kubectl -n tramplin wait --for=condition=Ready certificate/tramplin-api-tls --timeout=600s

nuclei-scan:
  stage: scan
  needs: [deploy-production]
  image:
    name: projectdiscovery/nuclei:v3.11.0
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - apk add --no-cache yq
  script:
    - public_host=$(yq -er '.data.PUBLIC_HOST' k8s/configmap.yaml)
    - nuclei -u "https://$public_host" -severity critical,high,medium -tags cve,exposure,misconfiguration -jsonl -o nuclei-report.jsonl
    - test ! -s nuclei-report.jsonl
  artifacts:
    when: always
    paths: [nuclei-report.jsonl]
    expire_in: 7 days
