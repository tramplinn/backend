# Tramplin — backend.
#
# Переменные проекта (Settings → CI/CD → Variables), все Protected:
#   SERVER_IP        адрес сервера развёртывания
#   SSH_PRIVATE_KEY  приватный ключ user1, base64 одной строкой (Masked)
#   STAGE_ENV        .env.runtime для stage — тип File: GitLab сам кладёт содержимое
#                    во временный файл, а $STAGE_ENV в джобе это путь к нему
#   PROD_ENV         то же для production, тоже File
#   STAGE_URL        адрес stage, по нему же ходит DAST
#   PROD_URL         адрес production

stages:
  - lint
  - test
  - security
  - build
  - deploy
  - dast

default:
  tags:
    - docker
    - linux

variables:
  DOCKER_IMAGE_API: "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_REF_SLUG"
  SSH_USER: "user1"
  SSH_PORT: "15945"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

# --- шаблоны ---------------------------------------------------------------

.python:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - uv sync --frozen
  after_script:
    - uv cache prune --ci

.on-merge-and-branches:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

.on-deploy-branches:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "stage"'

# --- проверки --------------------------------------------------------------

lint:
  extends:
    - .python
    - .on-merge-and-branches
  stage: lint
  script:
    - uv run ruff check src tests scripts alembic
    - uv run ruff format --check src tests scripts alembic

typecheck:
  extends:
    - .python
    - .on-merge-and-branches
  stage: lint
  script:
    - uv run mypy src tests scripts alembic

test:
  extends:
    - .python
    - .on-merge-and-branches
  stage: test
  script:
    - uv run pytest --junitxml=report.xml --cov-report=xml:coverage.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days

gitleaks:
  extends: .on-merge-and-branches
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

semgrep:
  extends: .on-merge-and-branches
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep scan --config=p/python --config=p/owasp-top-ten --error .

trivy-sca:
  extends: .on-merge-and-branches
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

# --- сборка ----------------------------------------------------------------

build-and-push:
  extends: .on-deploy-branches
  stage: build
  image: docker:27.5.0
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$DOCKER_IMAGE_API" .
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
      image --severity HIGH,CRITICAL --exit-code 1 "$DOCKER_IMAGE_API"
    - docker push "$DOCKER_IMAGE_API"
  after_script:
    - docker logout "$CI_REGISTRY"

# --- деплой ----------------------------------------------------------------

.deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf 'Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n' "$SSH_PORT" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - ssh "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
    - scp docker-compose.staging.yml scripts/deploy.sh "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
    - scp "$ENV_FILE" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/.env.runtime"
    - ssh "$SSH_USER@$SERVER_IP" "chmod 600 $DEPLOY_PATH/.env.runtime"
    - printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$SSH_USER@$SERVER_IP" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - ssh "$SSH_USER@$SERVER_IP"
      "DOCKER_IMAGE_API=$DOCKER_IMAGE_API COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME CI_REGISTRY=$CI_REGISTRY
       bash $DEPLOY_PATH/deploy.sh"

deploy_stage:
  extends: .deploy
  variables:
    DEPLOY_PATH: "/home/$SSH_USER/apps/backend_stage"
    COMPOSE_PROJECT_NAME: "tramplin-stage"
    ENV_FILE: "$STAGE_ENV"
  environment:
    name: staging
    url: "$STAGE_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'

deploy_prod:
  extends: .deploy
  variables:
    DEPLOY_PATH: "/home/$SSH_USER/apps/backend_prod"
    COMPOSE_PROJECT_NAME: "tramplin-prod"
    ENV_FILE: "$PROD_ENV"
  environment:
    name: production
    url: "$PROD_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- DAST ------------------------------------------------------------------

nuclei-scan:
  stage: dast
  image:
    name: projectdiscovery/nuclei:v3.3.8
    entrypoint: [""]
  script:
    - nuclei -u "$TARGET_URL" -severity critical,high,medium
      -tags cve,exposure,misconfiguration -duc -jsonl -o nuclei-report.jsonl
  artifacts:
    when: always
    paths:
      - nuclei-report.jsonl
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage"'
      variables:
        TARGET_URL: "$STAGE_URL"
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        TARGET_URL: "$PROD_URL"
