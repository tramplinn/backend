name: tramplin

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tramplin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tramplin}
      POSTGRES_DB: ${POSTGRES_DB:-tramplin}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tramplin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tramplin}
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./dev/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./dev/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: tramplin
      RUSTFS_SECRET_KEY: tramplin-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: tramplin
      AWS_SECRET_ACCESS_KEY: tramplin-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        s3() { aws --endpoint-url http://rustfs:9000 "$$@"; }
        until s3 s3api list-buckets > /dev/null; do sleep 1; done
        s3 s3api head-bucket --bucket tramplin 2>/dev/null || s3 s3api create-bucket --bucket tramplin
        s3 s3api put-bucket-policy --bucket tramplin --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::tramplin/*"]}]}'

  api:
    build: .
    image: tramplin-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD:-tramplin}@postgres:5432/${POSTGRES_DB:-tramplin}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tramplin}:${RABBITMQ_PASSWORD:-tramplin}@rabbitmq:5672/
      PISTON_URL: ${PISTON_CONTAINER_URL:-http://host.docker.internal:2000}
      S3_ACCESS_KEY: tramplin
      S3_SECRET_KEY: tramplin-dev-secret
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_PUBLIC_URL: http://localhost:9000/tramplin
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles: ["full"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  algorithm-worker:
    build: .
    image: tramplin-api:local
    command: ["python", "-m", "tramplin.algo_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD:-tramplin}@postgres:5432/${POSTGRES_DB:-tramplin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tramplin}:${RABBITMQ_PASSWORD:-tramplin}@rabbitmq:5672/
      ALGORITHM_QUEUE_NAME: algorithm-jobs
      PISTON_URL: ${PISTON_CONTAINER_URL:-http://host.docker.internal:2000}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "tramplin.algo_worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["full"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  embedding-worker:
    build: .
    image: tramplin-api:local
    command: ["python", "-m", "tramplin.embedding_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD:-tramplin}@postgres:5432/${POSTGRES_DB:-tramplin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tramplin}:${RABBITMQ_PASSWORD:-tramplin}@rabbitmq:5672/
      EMBEDDING_QUEUE_NAME: embedding-jobs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "tramplin.embedding_worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["full"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  email-worker:
    build: .
    image: tramplin-api:local
    command: ["python", "-m", "tramplin.email_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD:-tramplin}@postgres:5432/${POSTGRES_DB:-tramplin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tramplin}:${RABBITMQ_PASSWORD:-tramplin}@rabbitmq:5672/
      EMAIL_TRANSACTIONAL_QUEUE_NAME: email-transactional
      EMAIL_BULK_QUEUE_NAME: email-bulk
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "tramplin.email_worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["full"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rabbitmq_data:
  postgres_data:
  rustfs_data:
