apiVersion: batch/v1
kind: Job
metadata:
  name: tramplin-migrate
  namespace: tramplin
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: tramplin-migrate
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: gitlab-registry
      containers:
      - name: migrate
        image: registry.gitlab.com/tramplin1/backend/api:REPLACE_WITH_COMMIT_SHA
        command:
        - alembic
        - upgrade
        - head
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_DB
        - name: POSTGRES_APP_USER
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_APP_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: password
        - name: DATABASE_URL
          value: postgresql+asyncpg://$(POSTGRES_APP_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      restartPolicy: Never
