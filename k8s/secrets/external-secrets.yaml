apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tramplin-backend
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-tramplin-backend
    kind: SecretStore
  target:
    name: tramplin-backend
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: JWT_SECRET
  - secretKey: GITHUB_CLIENT_SECRET
    remoteRef:
      key: GITHUB_CLIENT_SECRET
  - secretKey: MCP_OAUTH_CLIENT_SECRET
    remoteRef:
      key: MCP_OAUTH_CLIENT_SECRET
  - secretKey: S3_ACCESS_KEY
    remoteRef:
      key: S3_ACCESS_KEY
  - secretKey: S3_SECRET_KEY
    remoteRef:
      key: S3_SECRET_KEY
  - secretKey: LLM_API_KEY
    remoteRef:
      key: LLM_API_KEY
  - secretKey: GITLAB_CLIENT_SECRET
    remoteRef:
      key: GITLAB_CLIENT_SECRET
  - secretKey: YANDEX_CLIENT_SECRET
    remoteRef:
      key: YANDEX_CLIENT_SECRET
