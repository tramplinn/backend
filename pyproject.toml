[project]
name = "tramplin-backend"
version = "0.1.0"
description = "Tramplin — платформа учебных курсов колледжа ННГУ"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "dishka>=1.10.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "httpx[socks]>=0.28.1",
    "pyjwt>=2.13.0",
    "uuid-utils>=0.17.0",
    "aioboto3>=15.5.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "anyio>=4.14.2",
    "openai>=3.7.0",
    "faststream[rabbit]>=0.7.5",
    "pgvector>=0.4.1",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
    "premailer>=3.10.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "types-aioboto3[s3]>=15.5.0",
    "types-pygments>=2.21.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tramplin"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A",
    "C4", "DTZ", "T20", "SIM", "TID", "RUF",
]
# RUF001-003: тексты сообщений и докстрингов на русском, кириллица в них не ошибка.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/versions/*" = ["N999", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uuid_utils.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["premailer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=tramplin",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["tramplin"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
