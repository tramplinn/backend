[project]
name = "tramplin-backend"
version = "0.1.0"
description = "Tramplin — платформа учебных курсов колледжа ННГУ"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "dishka>=1.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "httpx[socks]>=0.28",
    "pyjwt>=2.10",
    "uuid-utils>=0.10",
    "aioboto3>=15.5.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "anyio>=4.14.2",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "types-aioboto3[s3]>=15.5.0",
    "types-pygments>=2.21.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tramplin"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A",
    "C4", "DTZ", "T20", "SIM", "TID", "RUF",
]
# RUF001-003: тексты сообщений и докстрингов на русском, кириллица в них не ошибка.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/versions/*" = ["N999", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=tramplin",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["tramplin"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
