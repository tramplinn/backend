name: tramplin

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tramplin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tramplin}
      POSTGRES_DB: ${POSTGRES_DB:-tramplin}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ROOT_USER: tramplin
      MINIO_ROOT_PASSWORD: tramplin-dev-secret
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 tramplin tramplin-dev-secret; do sleep 1; done
        mc mb --ignore-existing local/tramplin
        mc anonymous set download local/tramplin

  api:
    build: .
    image: tramplin-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD:-tramplin}@postgres:5432/${POSTGRES_DB:-tramplin}
      REDIS_URL: redis://redis:6379/0
      JUDGE0_URL: http://tramplin-judge0:2358
      S3_ACCESS_KEY: tramplin
      S3_SECRET_KEY: tramplin-dev-secret
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/tramplin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles: ["full"]
    networks: [default, edge]

  algorithm-worker:
    build: .
    image: tramplin-api:local
    command: ["python", "-m", "tramplin.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD:-tramplin}@postgres:5432/${POSTGRES_DB:-tramplin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tramplin}:${RABBITMQ_PASSWORD:-tramplin}@tramplin-rabbitmq:5672/
      ALGORITHM_QUEUE_NAME: tramplin-local-algorithm-jobs
      JUDGE0_URL: http://tramplin-judge0:2358
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "tramplin.worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["full"]
    networks: [default, edge]

networks:
  edge:
    external: true
    name: tramplin-edge

volumes:
  postgres_data:
  minio_data:
