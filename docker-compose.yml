services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tramplin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tramplin}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres_data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 20s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${API_IMAGE:-tramplin-api:local}
    command: ["alembic", "upgrade", "head"]
    env_file: .env.runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tramplin}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]

  api:
    build: .
    image: ${API_IMAGE:-tramplin-api:local}
    restart: unless-stopped
    env_file: .env.runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tramplin}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      default: {}
      edge:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-tramplin}-api
    stop_grace_period: 20s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  algorithm-worker:
    build: .
    image: ${API_IMAGE:-tramplin-api:local}
    restart: unless-stopped
    command: ["python", "-m", "tramplin.algo_worker"]
    env_file: .env.runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tramplin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tramplin}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@tramplin-rabbitmq:5672/
      ALGORITHM_QUEUE_NAME: ${COMPOSE_PROJECT_NAME:-tramplin-staging}-algorithm-jobs
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tramplin.algo_worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [default, edge]
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  embedding-worker:
    build: .
    image: ${API_IMAGE:-tramplin-api:local}
    restart: unless-stopped
    command: ["python", "-m", "tramplin.embedding_worker"]
    env_file: .env.runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tramplin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tramplin}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tramplin}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@tramplin-rabbitmq:5672/
      EMBEDDING_QUEUE_NAME: ${COMPOSE_PROJECT_NAME:-tramplin-staging}-embedding-jobs
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tramplin.embedding_worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [default, edge]
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: tramplin-edge

volumes:
  postgres_data:
  redis_data:
